<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>התאמת מושגים לעולמות תוכן - דיאגרמת ון</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            height: 100vh;
            background: #0f172a;
            padding: 0.5rem 1rem;
            overflow: hidden;
            user-select: none;
            display: flex;
            flex-direction: column;
            touch-action: none;
        }

        .top-controls {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 0.5rem;
            z-index: 100;
            position: relative;
            flex-shrink: 0;
        }

        .btn-circle {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border: none;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
            font-size: 2rem;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-circle:hover {
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.6);
            transform: scale(1.1);
        }

        .btn-save,
        .btn-reset,
        .btn-export,
        .btn-import {
            padding: 0.5rem 1.25rem;
            border-radius: 9999px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 600;
            backdrop-filter: blur(10px);
        }

        .btn-save {
            color: #a78bfa;
        }

        .btn-reset {
            color: #f87171;
        }

        .btn-save:hover,
        .btn-reset:hover,
        .btn-export:hover,
        .btn-import:hover {
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            transform: translateY(-2px);
        }

        .btn-export {
            color: #60a5fa;
        }

        .btn-import {
            color: #34d399;
        }

        .diagram-container {
            position: relative;
            width: 100%;
            flex: 1;
            min-height: 0;
            margin-bottom: 0.5rem;
            border-radius: 1rem;
            background: radial-gradient(ellipse at center, rgba(99, 102, 241, 0.08) 0%, rgba(15, 23, 42, 0) 70%);
            border: 1px solid rgba(255, 255, 255, 0.06);
            touch-action: none;
        }

        .circle {
            position: absolute;
            border-radius: 50%;
            cursor: move;
            transition: width 0.3s, height 0.3s, background-color 0.3s, border-color 0.3s, left 0.3s, top 0.3s;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding-top: 1.5rem;
        }

        .circle.is-dragging {
            transition: none;
            opacity: 0.85;
            z-index: 1000 !important;
            cursor: grab;
        }

        .circle-title {
            font-size: 1.15rem;
            font-weight: bold;
            padding: 0.3rem 0.85rem;
            border-radius: 0.5rem;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(8px);
            text-align: center;
            max-width: 80%;
            pointer-events: auto;
            cursor: text;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .circle-title:hover {
            background: rgba(0, 0, 0, 0.5);
        }

        .concept-tag {
            position: absolute;
            padding: 0.4rem 0.85rem;
            border-radius: 999px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: grab;
            z-index: 50;
            transition: transform 0.2s, box-shadow 0.2s, left 0.3s, top 0.3s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transform: translate(-50%, -50%);
            backdrop-filter: blur(8px);
        }

        .concept-tag.is-dragging {
            transition: none;
            z-index: 100;
            transform: translate(-50%, -50%) scale(1.1);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
            opacity: 0.9;
        }

        .concept-tag:hover {
            z-index: 60;
            transform: translate(-50%, -50%) scale(1.05);
        }

        .boxes-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.5rem;
            align-items: center;
            margin-bottom: 0.25rem;
            min-height: 50px;
            padding: 0.5rem 1rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 0.75rem;
            border: 2px dashed rgba(255, 255, 255, 0.12);
            flex-shrink: 0;
        }

        .box {
            position: relative;
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.9), rgba(245, 158, 11, 0.9));
            padding: 0.75rem 1.25rem;
            border-radius: 0.75rem;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
            cursor: grab;
            font-weight: bold;
            color: #1e1b4b;
            font-size: 1.1rem;
            transition: transform 0.2s;
        }

        .box:hover {
            transform: translateY(-2px) scale(1.05);
        }

        .box:active {
            cursor: grabbing;
        }

        .btn-small {
            width: 48px;
            height: 48px;
            border-radius: 0.75rem;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            font-size: 1.5rem;
            color: #fbbf24;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .btn-small:hover {
            transform: scale(1.1);
            background: rgba(255, 255, 255, 0.15);
        }

        .input-container {
            display: flex;
            justify-content: center;
            margin-top: 0.25rem;
            margin-bottom: 0.25rem;
            flex-shrink: 0;
        }

        .text-input {
            width: 400px;
            padding: 1rem 1.5rem;
            border-radius: 9999px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            text-align: center;
            font-size: 1.1rem;
            outline: none;
            color: white;
        }

        .text-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .text-input:focus {
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.4);
            border-color: rgba(139, 92, 246, 0.5);
        }

        .separate-btn {
            position: absolute;
            background: #ef4444;
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.3);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            z-index: 20;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            top: 0;
            left: 0;
            transform: translate(-30%, -30%);
            display: none;
        }

        .circle:hover .separate-btn {
            display: flex;
        }

        .separate-btn:hover {
            transform: translate(-30%, -30%) scale(1.1);
            background: #dc2626;
        }

        .highlight-zone {
            background-color: rgba(255, 255, 255, 0.1);
            box-shadow: inset 0 0 30px rgba(139, 92, 246, 0.3);
        }
    </style>
</head>

<body>
    <div class="top-controls">
        <button class="btn-reset" onclick="resetState()">🔄 איפוס</button>
        <button class="btn-save" onclick="saveState()">💾 שמירה</button>
        <button class="btn-export" onclick="exportCSV()">📤 ייצוא CSV</button>
        <button class="btn-import" onclick="document.getElementById('csv-file-input').click()">📥 ייבוא CSV</button>
        <input type="file" id="csv-file-input" accept=".csv" style="display:none" onchange="importCSV(event)">
        <button class="btn-circle" onclick="addCircle()">+</button>
    </div>

    <!-- The main canvas for the Venn Diagram -->
    <div class="diagram-container" id="diagram-container"></div>

    <div class="boxes-container" id="boxes-container">
        <!-- Unplaced concepts go here -->
        <button class="btn-small" onclick="addBox()">+</button>
    </div>

    <div class="input-container">
        <input type="text" class="text-input" id="concept-input" placeholder="הקלד מושג ולחץ אנטר..."
            onkeypress="handleInput(event)" />
    </div>

    <script>
        // --- Color Palette ---
        // Each circle gets a unique vibrant color
        const CIRCLE_COLORS = [
            { bg: 'rgba(99, 102, 241, 0.18)',  border: '#818cf8', text: '#c7d2fe', tagBg: 'rgba(99, 102, 241, 0.25)',  tagBorder: '#818cf8', tagText: '#e0e7ff' },   // Indigo
            { bg: 'rgba(236, 72, 153, 0.18)',   border: '#f472b6', text: '#fce7f3', tagBg: 'rgba(236, 72, 153, 0.25)', tagBorder: '#f472b6', tagText: '#fce7f3' },   // Pink
            { bg: 'rgba(34, 211, 238, 0.18)',   border: '#22d3ee', text: '#cffafe', tagBg: 'rgba(34, 211, 238, 0.25)', tagBorder: '#22d3ee', tagText: '#cffafe' },   // Cyan
            { bg: 'rgba(163, 230, 53, 0.18)',   border: '#a3e635', text: '#ecfccb', tagBg: 'rgba(163, 230, 53, 0.25)', tagBorder: '#a3e635', tagText: '#ecfccb' },   // Lime
            { bg: 'rgba(251, 146, 60, 0.18)',   border: '#fb923c', text: '#fed7aa', tagBg: 'rgba(251, 146, 60, 0.25)', tagBorder: '#fb923c', tagText: '#ffedd5' },   // Orange
            { bg: 'rgba(167, 139, 250, 0.18)',  border: '#a78bfa', text: '#ddd6fe', tagBg: 'rgba(167, 139, 250, 0.25)',tagBorder: '#a78bfa', tagText: '#ede9fe' },   // Violet
            { bg: 'rgba(52, 211, 153, 0.18)',   border: '#34d399', text: '#a7f3d0', tagBg: 'rgba(52, 211, 153, 0.25)', tagBorder: '#34d399', tagText: '#d1fae5' },   // Emerald
            { bg: 'rgba(251, 191, 36, 0.18)',   border: '#fbbf24', text: '#fef3c7', tagBg: 'rgba(251, 191, 36, 0.25)', tagBorder: '#fbbf24', tagText: '#fef9c3' },   // Amber
        ];

        function getCircleColor(index) {
            return CIRCLE_COLORS[index % CIRCLE_COLORS.length];
        }

        // --- Data Models ---
        let circles = [
            { id: 1, title: 'עולם תוכן 1', x: 250, y: 200, groupId: null, _radius: 180 },
            { id: 2, title: 'עולם תוכן 2', x: 550, y: 200, groupId: null, _radius: 180 }
        ];

        let concepts = [
            { id: 1, text: 'מושג 1', circleIds: [] },
            { id: 2, text: 'מושג 2', circleIds: [] },
            { id: 3, text: 'מושג 3', circleIds: [] }
        ];

        let nextCircleId = 3;
        let nextConceptId = 4;
        let nextGroupId = 1;

        const BASE_RADIUS = 180;
        const RADIUS_PER_CONCEPT = 18;

        let draggedItem = null;
        let dragOffset = { x: 0, y: 0 };
        let dragStartPos = { x: 0, y: 0 };
        let didDrag = false;

        // --- Helpers ---
        // Estimate tag pixel width from text
        function estimateTagWidth(text) {
            // Average char width ~9px at 0.9rem, plus padding
            return Math.max(60, text.length * 9 + 28);
        }

        const TAG_HEIGHT = 32; // approximate height of a concept tag

        // --- Init ---
        function init() {
            loadState();
            render();

            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('mouseup', onMouseUp);
        }

        // --- Actions ---
        function addCircle() {
            const container = document.getElementById('diagram-container');
            const rect = container.getBoundingClientRect();
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            const angle = (circles.length * 2.4); // radians, spread them
            const dist = 180;
            const x = centerX + Math.cos(angle) * dist;
            const y = centerY + Math.sin(angle) * dist;
            circles.push({
                id: nextCircleId++,
                title: `עולם תוכן ${nextCircleId}`,
                x, y,
                groupId: null,
                _radius: BASE_RADIUS
            });
            render();
        }

        function addBox() {
            concepts.push({
                id: nextConceptId++,
                text: `מושג ${nextConceptId}`,
                circleIds: []
            });
            render();
        }

        function handleInput(e) {
            if (e.key === 'Enter') {
                const val = e.target.value.trim();
                let inputs = val.split(',').map(s => s.trim()).filter(s => s);
                if (inputs.length > 0) {
                    inputs.forEach(text => {
                        concepts.push({
                            id: nextConceptId++,
                            text: text,
                            circleIds: []
                        });
                    });
                    e.target.value = '';
                    render();
                }
            }
        }

        function separateCircle(id) {
            const c = circles.find(x => x.id === id);
            if (c && c.groupId) {
                const oldGroupId = c.groupId;
                c.groupId = null;
                c.x += 60;
                c.y += 60;

                const remaining = circles.filter(x => x.groupId === oldGroupId);
                if (remaining.length < 2) {
                    remaining.forEach(r => r.groupId = null);
                }

                render();
            }
        }

        function editCircleTitle(id) {
            const c = circles.find(x => x.id === id);
            const newTitle = prompt('שם עולם התוכן:', c.title);
            if (newTitle) {
                c.title = newTitle;
                render();
            }
        }

        // --- Rendering ---
        function render() {
            const container = document.getElementById('diagram-container');
            const boxesContainer = document.getElementById('boxes-container');

            // 0. Pre-calculate Radii based on concept count
            circles.forEach(c => {
                const count = concepts.filter(con => con.circleIds.includes(c.id)).length;
                c._radius = BASE_RADIUS + (count * RADIUS_PER_CONCEPT);
            });

            // 1. Calculate Venn Layouts for Groups
            applyVennLayouts();

            // 2. Resolve Collisions
            resolveConceptCollisions();

            // 3. Clear & Redraw
            container.innerHTML = '';

            const btn = boxesContainer.querySelector('.btn-small');
            boxesContainer.innerHTML = '';

            // Build a color index map for circles
            const circleColorMap = {};
            circles.forEach((c, i) => {
                circleColorMap[c.id] = i;
            });

            // 3. Render Circles
            circles.forEach((c, idx) => {
                const color = getCircleColor(idx);
                const el = document.createElement('div');
                el.className = 'circle';
                if (draggedItem && draggedItem.type === 'circle' && draggedItem.id === c.id) {
                    el.classList.add('is-dragging');
                }

                el.style.width = (c._radius * 2) + 'px';
                el.style.height = (c._radius * 2) + 'px';
                el.style.left = (c.x - c._radius) + 'px';
                el.style.top = (c.y - c._radius) + 'px';
                el.style.background = color.bg;
                el.style.border = `3px solid ${color.border}`;
                el.style.boxShadow = `0 0 40px ${color.bg}, inset 0 0 60px ${color.bg}`;
                el.dataset.id = c.id;

                // Title
                const title = document.createElement('div');
                title.className = 'circle-title';
                title.innerText = c.title;
                title.style.color = color.text;
                title.onmousedown = (e) => {
                    e.stopPropagation();
                };
                title.ondblclick = (e) => {
                    e.stopPropagation();
                    editCircleTitle(c.id);
                };
                el.appendChild(title);

                // Separate Button (only if grouped)
                if (c.groupId) {
                    const sep = document.createElement('div');
                    sep.className = 'separate-btn';
                    sep.innerText = '✕';
                    sep.onmousedown = (e) => {
                        e.stopPropagation();
                        separateCircle(c.id);
                    };
                    el.appendChild(sep);
                }

                el.onmousedown = (e) => startDrag(e, 'circle', c.id);

                container.appendChild(el);
            });

            // 4. Render Concepts
            concepts.forEach(c => {
                if (c.circleIds.length === 0) {
                    // Render in Box Container
                    const el = document.createElement('div');
                    el.className = 'box';
                    el.innerText = c.text;
                    el.onmousedown = (e) => startDrag(e, 'concept', c.id);
                    el.ondblclick = () => {
                        if (confirm('למחוק מושג?')) {
                            concepts = concepts.filter(x => x.id !== c.id);
                            render();
                        }
                    };
                    boxesContainer.appendChild(el);
                } else {
                    // Render in Diagram
                    const el = document.createElement('div');
                    el.className = 'concept-tag';
                    el.innerText = c.text;

                    // Determine tag color based on assigned circles
                    const primaryCircleIdx = circleColorMap[c.circleIds[0]] || 0;
                    if (c.circleIds.length === 1) {
                        const color = getCircleColor(primaryCircleIdx);
                        el.style.background = color.tagBg;
                        el.style.border = `2px solid ${color.tagBorder}`;
                        el.style.color = color.tagText;
                        el.style.boxShadow = `0 2px 10px rgba(0,0,0,0.3)`;
                    } else {
                        // Multi-circle: blend colors - use white/bright style
                        el.style.background = 'rgba(255, 255, 255, 0.12)';
                        el.style.border = '2px solid rgba(255, 255, 255, 0.4)';
                        el.style.color = '#ffffff';
                        el.style.boxShadow = '0 2px 12px rgba(255,255,255,0.15)';
                    }

                    if (draggedItem && draggedItem.type === 'concept' && draggedItem.id === c.id) {
                        el.classList.add('is-dragging');
                        el.style.left = draggedItem.currentX + 'px';
                        el.style.top = draggedItem.currentY + 'px';
                    } else {
                        if (c._x === undefined || c._y === undefined) {
                            const pos = getConceptPosition(c);
                            c._x = pos.x; c._y = pos.y;
                        }
                        el.style.left = c._x + 'px';
                        el.style.top = c._y + 'px';
                    }

                    el.onmousedown = (e) => startDrag(e, 'concept', c.id);
                    el.ondblclick = (e) => {
                        e.stopPropagation();
                        c.circleIds = [];
                        render();
                    };

                    container.appendChild(el);
                }
            });

            boxesContainer.appendChild(btn);
        }

        function applyVennLayouts() {
            const groups = {};
            circles.forEach(c => {
                if (c.groupId) {
                    if (!groups[c.groupId]) groups[c.groupId] = [];
                    groups[c.groupId].push(c);
                }
            });

            Object.values(groups).forEach(group => {
                const count = group.length;
                if (count < 2) return;

                let cx = 0, cy = 0;
                group.forEach(c => { cx += c.x; cy += c.y; });
                cx /= count;
                cy /= count;

                const r = group[0]._radius;
                const offset = r * 0.8;

                if (count === 2) {
                    group[0].x = cx - offset / 2;
                    group[0].y = cy;
                    group[1].x = cx + offset / 2;
                    group[1].y = cy;
                } else if (count === 3) {
                    const h = r * Math.sin(Math.PI / 3);

                    group[0].x = cx;
                    group[0].y = cy - h * (2 / 3);

                    group[1].x = cx - r * 0.5;
                    group[1].y = cy + h * (1 / 3);

                    group[2].x = cx + r * 0.5;
                    group[2].y = cy + h * (1 / 3);
                } else {
                    const step = (2 * Math.PI) / count;
                    group.forEach((c, i) => {
                        c.x = cx + Math.cos(i * step) * r * 0.8;
                        c.y = cy + Math.sin(i * step) * r * 0.8;
                    });
                }
            });
        }

        function getConceptPosition(concept) {
            const assigned = circles.filter(c => concept.circleIds.includes(c.id));
            if (assigned.length === 0) return { x: 0, y: 0 };

            // Calculate Centroid of assigned circles
            let sx = 0, sy = 0;
            assigned.forEach(c => {
                sx += c.x;
                sy += c.y;
            });
            let x = sx / assigned.length;
            let y = sy / assigned.length;

            // Repulsion from unassigned circles in same group
            if (assigned[0].groupId) {
                const groupCircles = circles.filter(c => c.groupId === assigned[0].groupId);
                const unassigned = groupCircles.filter(c => !concept.circleIds.includes(c.id));

                unassigned.forEach(u => {
                    const dx = x - u.x;
                    const dy = y - u.y;
                    const dist = Math.sqrt(dx * dx + dy * dy) || 1;
                    const pushFactor = 80;
                    x += (dx / dist) * pushFactor;
                    y += (dy / dist) * pushFactor;
                });
            }

            return { x, y };
        }

        // --- Collision Resolution ---
        function resolveConceptCollisions() {
            const placed = concepts.filter(c => c.circleIds.length > 0);

            // Assign ideal positions
            placed.forEach(c => {
                if (draggedItem && draggedItem.type === 'concept' && draggedItem.id === c.id) return;
                const pos = getConceptPosition(c);
                c._x = pos.x;
                c._y = pos.y;
            });

            // Initial jitter based on ID to prevent perfect stacking
            placed.forEach(c => {
                if (draggedItem && draggedItem.type === 'concept' && draggedItem.id === c.id) return;
                c._x += (c.id * 1337) % 60 - 30;
                c._y += (c.id * 71) % 60 - 30;
            });

            // Iterative collision solver with actual tag dimensions
            const iterations = 80;

            for (let k = 0; k < iterations; k++) {
                let moved = false;
                for (let i = 0; i < placed.length; i++) {
                    for (let j = i + 1; j < placed.length; j++) {
                        const c1 = placed[i];
                        const c2 = placed[j];

                        if (draggedItem && (draggedItem.id === c1.id || draggedItem.id === c2.id)) continue;

                        // Use actual estimated widths
                        const w1 = estimateTagWidth(c1.text);
                        const w2 = estimateTagWidth(c2.text);
                        const h = TAG_HEIGHT;

                        const dx = c1._x - c2._x;
                        const dy = c1._y - c2._y;

                        // Required separation: half-widths + gap
                        const minDistX = (w1 + w2) / 2 + 8;
                        const minDistY = h + 6;

                        // Check overlap using rectangular collision
                        const overlapX = minDistX - Math.abs(dx);
                        const overlapY = minDistY - Math.abs(dy);

                        if (overlapX > 0 && overlapY > 0) {
                            // Resolve by pushing along the axis with smaller overlap
                            if (overlapX < overlapY) {
                                const push = overlapX * 0.52;
                                const dir = dx >= 0 ? 1 : -1;
                                c1._x += dir * push;
                                c2._x -= dir * push;
                            } else {
                                const push = overlapY * 0.52;
                                const dir = dy >= 0 ? 1 : -1;
                                c1._y += dir * push;
                                c2._y -= dir * push;
                            }
                            moved = true;
                        }
                    }
                }

                // Also constrain concepts to stay within their assigned circle(s)
                placed.forEach(c => {
                    if (draggedItem && draggedItem.type === 'concept' && draggedItem.id === c.id) return;
                    const assigned = circles.filter(ci => c.circleIds.includes(ci.id));
                    if (assigned.length === 0) return;

                    // Find the enclosing region - for single circle, stay inside it
                    // For multi-circle intersection, stay near centroid
                    if (assigned.length === 1) {
                        const ci = assigned[0];
                        const dx = c._x - ci.x;
                        const dy = c._y - ci.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        const maxDist = ci._radius - 40; // keep tag inside circle with margin
                        if (dist > maxDist && dist > 0) {
                            c._x = ci.x + (dx / dist) * maxDist;
                            c._y = ci.y + (dy / dist) * maxDist;
                        }
                    }
                });

                if (!moved) break;
            }
        }

        function startDrag(e, type, id) {
            e.stopPropagation();
            e.preventDefault();

            dragStartPos = { x: e.clientX, y: e.clientY };
            didDrag = false;
            draggedItem = { type, id };

            if (type === 'circle') {
                const c = circles.find(x => x.id === id);
                const containerRect = document.getElementById('diagram-container').getBoundingClientRect();
                const relMX = e.clientX - containerRect.left;
                const relMY = e.clientY - containerRect.top;
                dragOffset = { x: relMX - c.x, y: relMY - c.y };

            } else if (type === 'concept') {
                draggedItem.currentX = e.clientX;
                draggedItem.currentY = e.clientY;
            }
        }

        function onMouseMove(e) {
            if (!draggedItem) return;
            e.preventDefault();

            const moveDist = Math.abs(e.clientX - dragStartPos.x) + Math.abs(e.clientY - dragStartPos.y);
            if (moveDist > 5) didDrag = true;
            if (!didDrag) return;

            const container = document.getElementById('diagram-container');
            const rect = container.getBoundingClientRect();
            const relX = e.clientX - rect.left;
            const relY = e.clientY - rect.top;

            if (draggedItem.type === 'circle') {
                const c = circles.find(x => x.id === draggedItem.id);

                if (c.groupId) {
                    const oldGroupId = c.groupId;
                    c.groupId = null;
                    const remaining = circles.filter(x => x.groupId === oldGroupId);
                    if (remaining.length < 2) {
                        remaining.forEach(r => r.groupId = null);
                    }
                }

                c.x = relX - dragOffset.x;
                c.y = relY - dragOffset.y;

                requestAnimationFrame(() => render());

            } else if (draggedItem.type === 'concept') {
                draggedItem.currentX = relX;
                draggedItem.currentY = relY;
                requestAnimationFrame(() => render());
            }
        }

        function onMouseUp(e) {
            if (!draggedItem) return;

            if (!didDrag && draggedItem.type === 'concept') {
                editConcept(draggedItem.id);
                draggedItem = null;
                return;
            }

            if (draggedItem.type === 'circle') {
                const c = circles.find(x => x.id === draggedItem.id);
                if (!c.groupId) {
                    const others = circles.filter(x => x.id !== c.id);
                    for (let other of others) {
                        const dx = c.x - other.x;
                        const dy = c.y - other.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < (c._radius + other._radius) * 0.8) {
                            mergeCircles(c, other);
                            break;
                        }
                    }
                }
            } else if (draggedItem.type === 'concept') {
                const containerRect = document.getElementById('diagram-container').getBoundingClientRect();
                const mx = e.clientX - containerRect.left;
                const my = e.clientY - containerRect.top;

                const hitCircles = circles.filter(c => {
                    const dx = mx - c.x;
                    const dy = my - c.y;
                    return Math.sqrt(dx * dx + dy * dy) < c._radius;
                });

                const concept = concepts.find(x => x.id === draggedItem.id);

                if (hitCircles.length > 0) {
                    concept.circleIds = hitCircles.map(x => x.id);
                } else {
                    const boxRect = document.getElementById('boxes-container').getBoundingClientRect();
                    if (
                        e.clientX > boxRect.left && e.clientX < boxRect.right &&
                        e.clientY > boxRect.top && e.clientY < boxRect.bottom
                    ) {
                        concept.circleIds = [];
                    } else {
                        if (
                            e.clientX < containerRect.left || e.clientX > containerRect.right ||
                            e.clientY < containerRect.top || e.clientY > containerRect.bottom
                        ) {
                            concept.circleIds = [];
                        } else {
                            concept.circleIds = [];
                        }
                    }
                }
            }

            draggedItem = null;
            render();
            document.querySelectorAll('.is-dragging').forEach(el => el.classList.remove('is-dragging'));
        }

        function mergeCircles(c1, c2) {
            const gid = c1.groupId || c2.groupId || nextGroupId++;

            const affected = circles.filter(c =>
                c.groupId === c1.groupId || c.groupId === c2.groupId || c.id === c1.id || c.id === c2.id
            );

            affected.forEach(c => c.groupId = gid);
            render();
        }

        function editConcept(id) {
            const c = concepts.find(x => x.id === id);
            if (!c) return;
            const newText = prompt('ערוך מושג:', c.text);
            if (newText !== null && newText.trim()) {
                c.text = newText.trim();
                render();
            }
        }

        function saveState() {
            const s = { circles, concepts, nextCircleId, nextConceptId };
            localStorage.setItem('conceptMatcherStateV2', JSON.stringify(s));
            alert('נשמר בהצלחה!');
        }

        function loadState() {
            const s = localStorage.getItem('conceptMatcherStateV2');
            if (s) {
                try {
                    const d = JSON.parse(s);
                    circles = d.circles || circles;
                    concepts = d.concepts || concepts;
                    nextCircleId = d.nextCircleId || nextCircleId;
                    nextConceptId = d.nextConceptId || nextConceptId;
                } catch (e) { console.error(e); }
            }
        }

        function resetState() {
            if (confirm('האם לאפס את הכל?')) {
                localStorage.removeItem('conceptMatcherStateV2');
                location.reload();
            }
        }

        // --- CSV Export ---
        function exportCSV() {
            const BOM = '\uFEFF';
            let csvContent = BOM + '"שם מושג","שם עולם תוכן"\n';

            concepts.forEach(concept => {
                if (concept.circleIds.length === 0) {
                    csvContent += `"${concept.text}",""\n`;
                } else {
                    concept.circleIds.forEach(cid => {
                        const circle = circles.find(c => c.id === cid);
                        if (circle) {
                            csvContent += `"${concept.text}","${circle.title}"\n`;
                        }
                    });
                }
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'concepts_export.csv';
            a.click();
            URL.revokeObjectURL(url);
        }

        // --- CSV Import ---
        function importCSV(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function (e) {
                const text = e.target.result;
                parseAndLoadCSV(text);
            };
            reader.readAsText(file, 'UTF-8');
            event.target.value = '';
        }

        function parseAndLoadCSV(text) {
            const lines = text.split(/\r?\n/).filter(l => l.trim());
            if (lines.length < 1) return;

            const dataLines = lines.slice(1);

            const rows = [];
            dataLines.forEach(line => {
                const fields = parseCSVLine(line);
                if (fields.length >= 1) {
                    rows.push({
                        conceptName: fields[0].trim(),
                        worldName: fields.length > 1 ? fields[1].trim() : ''
                    });
                }
            });

            if (rows.length === 0) return;

            const worldNames = [...new Set(rows.map(r => r.worldName).filter(w => w))];

            const newCircles = [];
            let cId = 1;
            const centerX = 400;
            const centerY = 250;

            worldNames.forEach((name, i) => {
                let x, y;
                if (worldNames.length <= 3) {
                    if (worldNames.length === 1) {
                        x = centerX; y = centerY;
                    } else if (worldNames.length === 2) {
                        x = centerX + (i === 0 ? -100 : 100);
                        y = centerY;
                    } else {
                        const angles = [-Math.PI / 2, Math.PI / 6, 5 * Math.PI / 6];
                        x = centerX + Math.cos(angles[i]) * 120;
                        y = centerY + Math.sin(angles[i]) * 120;
                    }
                } else {
                    const angle = (2 * Math.PI * i) / worldNames.length - Math.PI / 2;
                    x = centerX + Math.cos(angle) * 180;
                    y = centerY + Math.sin(angle) * 180;
                }

                newCircles.push({
                    id: cId,
                    title: name,
                    x, y,
                    groupId: null,
                    _radius: BASE_RADIUS
                });
                cId++;
            });

            const conceptMap = {};
            rows.forEach(r => {
                if (!conceptMap[r.conceptName]) conceptMap[r.conceptName] = new Set();
                if (r.worldName) conceptMap[r.conceptName].add(r.worldName);
            });

            const newConcepts = [];
            let conId = 1;
            Object.entries(conceptMap).forEach(([name, worlds]) => {
                const circleIds = [];
                worlds.forEach(wName => {
                    const circle = newCircles.find(c => c.title === wName);
                    if (circle) circleIds.push(circle.id);
                });
                newConcepts.push({
                    id: conId++,
                    text: name,
                    circleIds: circleIds
                });
            });

            let gId = 1;
            newConcepts.forEach(concept => {
                if (concept.circleIds.length >= 2) {
                    const relevantCircles = newCircles.filter(c => concept.circleIds.includes(c.id));

                    const existingGroupIds = relevantCircles.map(c => c.groupId).filter(g => g !== null);
                    let targetGroupId;
                    if (existingGroupIds.length > 0) {
                        targetGroupId = existingGroupIds[0];
                        existingGroupIds.forEach(eg => {
                            newCircles.forEach(c => {
                                if (c.groupId === eg) c.groupId = targetGroupId;
                            });
                        });
                    } else {
                        targetGroupId = gId++;
                    }
                    relevantCircles.forEach(c => c.groupId = targetGroupId);
                }
            });

            circles = newCircles;
            concepts = newConcepts;
            nextCircleId = cId;
            nextConceptId = conId;
            nextGroupId = gId;

            render();
            alert('ייבוא הושלם בהצלחה! ✓');
        }

        function parseCSVLine(line) {
            const fields = [];
            let current = '';
            let inQuotes = false;

            for (let i = 0; i < line.length; i++) {
                const ch = line[i];
                if (inQuotes) {
                    if (ch === '"') {
                        if (i + 1 < line.length && line[i + 1] === '"') {
                            current += '"';
                            i++;
                        } else {
                            inQuotes = false;
                        }
                    } else {
                        current += ch;
                    }
                } else {
                    if (ch === '"') {
                        inQuotes = true;
                    } else if (ch === ',') {
                        fields.push(current);
                        current = '';
                    } else {
                        current += ch;
                    }
                }
            }
            fields.push(current);
            return fields;
        }

        // Run
        init();

    </script>
